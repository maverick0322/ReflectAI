name: Pruebas Unitarias, Integracion y Regresion

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-suite:
    name: Validar suite general de pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./reflectai/package-lock.json"

      - name: Instalar dependencias
        working-directory: ./reflectai
        run: npm ci

      - name: Ejecutar pruebas unitarias
        working-directory: ./reflectai
        run: npm run test:unit

      - name: Ejecutar pruebas de integracion
        working-directory: ./reflectai
        run: npm run test:integration -- --reporter=verbose

      - name: Ejecutar pruebas de regresion
        working-directory: ./reflectai
        run: npm run test:regression -- --reporter=verbose

      - name: Ejecutar suite completa con cobertura
        working-directory: ./reflectai
        run: npm run test:coverage

      - name: Reportar resultado en PR
        if: github.event_name == 'pull_request'
        working-directory: ./reflectai
        run: |
          echo "**Validacion de Pruebas ReflectAI**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Unitarias: ejecutadas con \`npm run test:unit\`" >> $GITHUB_STEP_SUMMARY
          echo "- Integracion: \`__tests__/integration/api.integration.test.ts\`" >> $GITHUB_STEP_SUMMARY
          echo "- Regresion: \`__tests__/regression/newFeature.regression.test.tsx\`" >> $GITHUB_STEP_SUMMARY
          echo "- Cobertura: validada contra thresholds de \`vitest.config.ts\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Registros: [Integracion](reflectai/__tests__/integration/Registro-Ejecucion-Integracion.md) y [Regresion](reflectai/__tests__/regression/Registro-Ejecucion-Regresion.md)" >> $GITHUB_STEP_SUMMARY

  check-routes:
    name: Validar rutas criticas
    runs-on: ubuntu-latest
    needs: test-suite

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar existencia de rutas API criticas
        working-directory: ./reflectai
        run: |
          echo "Validando rutas API criticas..."

          ROUTES=(
            "src/app/api/auth/register/route.ts"
            "src/app/api/auth/login/route.ts"
            "src/app/api/auth/logout/route.ts"
            "src/app/api/auth/recover/route.ts"
            "src/app/api/auth/confirm-recovery/route.ts"
            "src/app/api/auth/change-password/route.ts"
            "src/app/api/auth/delete-account/route.ts"
            "src/app/api/profile/route.ts"
            "src/app/api/profile/avatar/route.ts"
            "src/app/api/reflection-sessions/route.ts"
            "src/app/api/reflection-sessions/[id]/route.ts"
            "src/app/api/reflection-sessions/[id]/responses/route.ts"
            "src/app/api/reflection-sessions/[id]/complete/route.ts"
            "src/app/api/ai/daily-quote/route.ts"
            "src/app/api/ai/next-question/route.ts"
            "src/app/api/ai/analyze-session/route.ts"
            "src/app/auth/callback/route.ts"
          )

          MISSING=0
          for route in "${ROUTES[@]}"; do
            if [ -f "$route" ]; then
              echo "Encontrada: $route"
            else
              echo "FALLO: No se encontro ruta esperada: $route"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "$MISSING ruta(s) critica(s) faltante(s)"
            exit 1
          fi
          echo "Todas las rutas criticas estan presentes"

      - name: Exito - aprobacion de PR
        run: |
          echo "Todas las validaciones pasaron correctamente"
          echo "El PR puede ser fusionado a main sin riesgos de pruebas conocidos"
